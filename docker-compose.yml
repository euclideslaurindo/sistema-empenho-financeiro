version: '3.8'

services:
  app:
    build: .
    container_name: sistema-empenho-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # As variáveis abaixo devem ser preenchidas no seu servidor via arquivo .env
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - APP_URL=${APP_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
