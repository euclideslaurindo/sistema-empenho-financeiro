name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run lint:types

    - name: ESLint Check
      run: npm run lint

    - name: Run Tests (Vitest)
      run: npm run test
      env:
        JWT_SECRET: "ci-test-secret"
        APP_URL: "http://localhost:3000"

    - name: Build Next.js
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        JWT_SECRET: "ci-test-secret"

    - name: Check Health Endpoint
      run: |
        # O build usa output: 'standalone' (next.config.ts), pensado pro Dockerfile.
        # "next start" não funciona com standalone — precisa rodar o server.js
        # gerado, com public/ e .next/static copiados pra dentro dele, igual
        # o Dockerfile já faz na etapa de runner.
        cp -r public .next/standalone/public
        cp -r .next/static .next/standalone/.next/static

        node .next/standalone/server.js &
        for i in $(seq 1 30); do
          if curl -sf http://localhost:3000/api/health > /dev/null; then
            echo "Health check passed."
            exit 0
          fi
          sleep 1
        done
        echo "Health check failed after 30s."
        exit 1
      env:
        JWT_SECRET: "ci-test-secret"
        APP_URL: "http://localhost:3000"
        PORT: "3000"
        HOSTNAME: "0.0.0.0"

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: empenho
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: empenho
      JWT_SECRET: "ci-test-secret"
      APP_URL: "http://localhost:3000"
      ENABLE_SETUP: "true"
      ADMIN_INITIAL_PASSWORD: "Mudar@123"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E tests
      run: npm run test:e2e

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
